name: Sync Google Sheet to data.csv

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-sheet
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch published CSV
        run: |
          URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSwMBXXKn2dR9KauzmBSgTdGtyiIKzqnihJ0K0syxCJOf3UlkmL-lObOYdParrRYraNvrPlOtNQU7N9/pub?gid=0&single=true&output=csv"
          curl -L -sS --max-time 60 "$URL" -o data.csv.tmp
          if [ -s data.csv.tmp ] && head -1 data.csv.tmp | grep -qi "client"; then
            mv data.csv.tmp data.csv
            echo "OK: data.csv updated ($(wc -l < data.csv) lines)"
          else
            echo "::error::Fetched content invalid — keeping existing data.csv"
            rm -f data.csv.tmp
            exit 1
          fi

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.csv
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: sync portfolio data.csv"
            git push
          fi
